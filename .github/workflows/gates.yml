# The claim this repository makes loudest is that a clone with no graph, no
# corpus, no credentials and no network builds green. This is where that stops
# being a claim. A runner has none of those things and runs the same `pnpm
# gates` a contributor does, on `fixtures/demo`, with the nine suites that
# assert real Gujarat facts skipping themselves out loud.
#
# The other half, `pnpm gates:integration`, cannot run here and is not meant to:
# it needs the private graph and refuses to start without it.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gates
      - run: pnpm --filter @ariane/web build
